services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: skilltrade
      POSTGRES_USER: skilltrade
      POSTGRES_PASSWORD: change-me-db-password
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilltrade -d skilltrade"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      SECRET_KEY: change-me-to-a-long-random-string
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      DB_NAME: skilltrade
      DB_USER: skilltrade
      DB_PASSWORD: change-me-db-password
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pg-data: